<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineWatch — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 28px 24px;
  }
  .login-card .brand { display:flex; align-items:baseline; gap:10px; margin-bottom: 4px; }
  .login-card .mark { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); }
  .login-card h1 { font-size: 18px; margin: 0; }
  .login-card .subtitle { color: var(--text-dim); font-size: 12.5px; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 3px;
    font-family: var(--font-data);
    font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .submit-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #0d1418;
    font-weight: 600;
    padding: 10px;
    border-radius: 3px;
    font-size: 13.5px;
    cursor: pointer;
    margin-top: 6px;
  }
  .error-msg {
    background: rgba(198,59,59,0.12);
    border: 1px solid var(--risk-critical);
    color: var(--risk-critical);
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .demo-hint {
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--font-data);
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand"><span class="mark"></span><h1>MineWatch</h1></div>
    <div class="subtitle">Real-Time Subsidence Monitoring &amp; Early Warning</div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit-btn">Sign in</button>
    </form>

    <div class="demo-hint">
      DEMO CREDENTIALS<br>
      operator / operator123 (live monitoring)<br>
      planner / planner123 (trends &amp; predictions)<br>
      regulator / regulator123 (overview &amp; reports)
    </div>
  </div>
</body>
</html>
